# nginx for the Caduceus look-pack editor: static files only, runs as a non-root user on port 8080.
# The Dockerfile puts the same build at / and at /caduceus/, so the app works on its own (sub)domain and behind a
# proxy or Cloudflare Tunnel rule that forwards example.com/caduceus/... unchanged (all asset URLs are relative).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  types { text/plain md; }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/plain text/css application/javascript application/json;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # hashed build assets never change; everything else (index.html, samples) is revalidated
  map $uri $cache_control {
    ~^/(caduceus/)?assets/ "public, max-age=31536000, immutable";
    default "no-cache";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # static site: only GET/HEAD
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /caduceus { return 301 /caduceus/; }
    location /caduceus/ { try_files $uri $uri/ /caduceus/index.html; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
