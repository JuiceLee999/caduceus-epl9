# Example: run the look-pack editor on a NAS. `docker compose up -d --build` in this folder.
# The app is then at http://<nas>:8080/ and http://<nas>:8080/caduceus/ .
services:
  caduceus-looks:
    build: .
    image: caduceus-looks:latest
    container_name: caduceus-looks
    restart: unless-stopped
    ports:
      - "${CADUCEUS_PORT:-8080}:8080"   # drop this if only the tunnel below should reach it
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64

  # Optional: publish through Cloudflare Tunnel (no open ports on the NAS). Create a tunnel in the Cloudflare
  # dashboard (Zero Trust > Networks > Tunnels), add a public hostname, e.g. example.com path caduceus*
  # -> service http://caduceus-looks:8080, and put its token in a .env file next to this file: TUNNEL_TOKEN=...
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  #   depends_on:
  #     - caduceus-looks
